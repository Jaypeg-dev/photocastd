# Photocastd Configuration

# Chromecast devices
devices:
  - name: "Living Room"
    host: "192.168.1.100"
  - name: "Bedroom"
    host: "192.168.1.101"

# Source folders to monitor
sources:
  photos: "./photos"
  videos: "./videos"

# Device routing: maps source folders to target devices
# If not specified, sources cast to all devices
routing:
  photos:
    - "Living Room"
  videos:
    - "Living Room"
    - "Bedroom"
